apiVersion: v1
kind: Namespace
metadata:
  name: opencode-memory-graph-test
  labels:
    app.kubernetes.io/part-of: opencode-memory-graph
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb-memory-graph
  namespace: opencode-memory-graph-test
  labels:
    app.kubernetes.io/instance: falkordb-memory-graph
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: opencode-memory-graph
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: falkordb-memory-graph
    app.kubernetes.io/name: falkordb
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
    - name: browser
      protocol: TCP
      port: 3000
      targetPort: browser
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb-memory-graph
  namespace: opencode-memory-graph-test
  labels:
    app.kubernetes.io/instance: falkordb-memory-graph
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: opencode-memory-graph
spec:
  serviceName: falkordb-memory-graph
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: falkordb-memory-graph
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: falkordb-memory-graph
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/part-of: opencode-memory-graph
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: falkordb
          image: falkordb/falkordb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
            - containerPort: 3000
              name: browser
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: opencode-memory-graph
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
