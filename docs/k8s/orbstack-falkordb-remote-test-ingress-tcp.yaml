apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: falkordb-memory-graph-tcp
  namespace: opencode-memory-graph-test
  labels:
    app.kubernetes.io/instance: falkordb-memory-graph
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: opencode-memory-graph
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`falkordb-memory-graph.usableapps.local`)
      services:
        - name: falkordb-memory-graph
          port: 6379
  tls:
    passthrough: false
    secretName: falkordb-memory-graph-ingress-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: falkordb-memory-graph-dns
  namespace: opencode-memory-graph-test
  labels:
    app.kubernetes.io/instance: falkordb-memory-graph
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: opencode-memory-graph
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: falkordb-memory-graph.usableapps.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: falkordb-memory-graph
                port:
                  number: 3000
